name: Release

# Actions → Release → Run workflow. Versions come from conventional commits
# since the last v* tag unless a specifier is forced. Publishes with npm trusted
# publishing (OIDC), so no npm token is stored anywhere. Use publish-only to
# retry publishing the latest tag after a failed publish.
#
# Release paths (run with dry-run first; the resolved version is shown in the
# job summary):
#   beta      specifier: auto + prerelease. From a stable version, the
#             commit-derived bump as a beta (breaking while 0.x -> next minor,
#             e.g. 0.1.4 -> 0.2.0-beta.0); from a beta, the next beta
#             (0.2.0-beta.0 -> 0.2.0-beta.1)
#   graduate  specifier: patch (0.2.0-beta.1 -> 0.2.0)
#   stable    specifier: auto from a stable version (fix -> patch, feat -> patch
#             and breaking -> minor while 0.x)
# Combinations that would silently do something else fail instead.
on:
  workflow_dispatch:
    inputs:
      specifier:
        description: 'auto = from conventional commits (beta: tick prerelease). patch = graduate a beta (0.2.0-beta.1 -> 0.2.0) or force a patch. minor/major force the bump (adjusted while 0.x: major -> next minor)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      prerelease:
        description: 'Beta prerelease, only with specifier auto: stable -> beta of the commit-derived bump (0.1.4 -> 0.2.0-beta.0); beta -> next beta'
        type: boolean
        default: false
      dry-run:
        description: 'Preview version and changelog without committing, tagging or publishing'
        type: boolean
        default: false
      publish-only:
        description: 'Skip versioning; rebuild and publish the latest v* tag (retry a failed publish). Ignores specifier/prerelease; dry-run previews the publish'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version commit, tag and GitHub release
  id-token: write # npm trusted publishing

env:
  NX_NO_CLOUD: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for conventional commits

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Builds (preVersionCommand), versions, writes CHANGELOG.md, then commits,
      # tags, pushes and creates the GitHub release. With publish-only, checks
      # out the latest v* tag and rebuilds dist instead, so a failed publish can
      # be retried (a plain re-run creates no new tag and would skip publishing)
      - name: Version and changelog
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECIFIER: ${{ inputs.specifier }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRY_RUN: ${{ inputs.dry-run }}
          PUBLISH_ONLY: ${{ inputs.publish-only }}
        run: |
          before=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo none)

          if [ "$PUBLISH_ONLY" = true ]; then
            if [ "$before" = none ]; then
              echo "No v* tag to publish"
              exit 1
            fi
            git checkout "$before"
            pnpm exec nx run-many -t build

            version=${before#v}
            case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Publishing existing $before (npm dist-tag: $tag)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Fail on inputs that would silently release something else
          if [ "$PRERELEASE" = true ] && [ "$SPECIFIER" != auto ]; then
            echo "::error::prerelease only applies with specifier 'auto' (a forced '$SPECIFIER' would ignore it). For a beta use auto + prerelease; to graduate a beta use patch without prerelease."
            exit 1
          fi
          case "$before" in
            v*-*)
              if [ "$SPECIFIER" = auto ] && [ "$PRERELEASE" != true ]; then
                echo "::error::The latest tag $before is a prerelease: specifier 'auto' would only cut the next beta. Use specifier 'patch' to graduate it to ${before%%-*}, or tick prerelease for another beta."
                exit 1
              fi
              ;;
          esac

          args=(--skip-publish)
          [ "$SPECIFIER" != auto ] && args=("$SPECIFIER" "${args[@]}")
          [ "$PRERELEASE" = true ] && args+=(--preid beta)
          [ "$DRY_RUN" = true ] && args+=(--dry-run)

          set -o pipefail
          log="${RUNNER_TEMP:-/tmp}/nx-release.log"
          pnpm exec nx release "${args[@]}" 2>&1 | tee "$log"

          # Projects are released together, so the first manifest line names the version
          resolved=$(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -oE 'New version [^ ]+ written' | head -1 | awk '{print $3}')
          {
            echo "### Release ${resolved:-(no version change)}"
            echo ""
            echo "- previous tag: \`$before\`"
            echo "- inputs: specifier \`$SPECIFIER\`, prerelease \`$PRERELEASE\`, dry-run \`$DRY_RUN\`"
            case "$resolved" in
              *-*) echo "- npm dist-tag: \`next\` (prerelease)" ;;
              ?*) echo "- npm dist-tag: \`latest\`" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          after=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo none)
          if [ "$DRY_RUN" = true ] || [ "$before" = "$after" ]; then
            echo "No new release tag created; skipping publish"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=${after#v}
          # Prereleases go to "next" so `npm i` keeps resolving the latest stable
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Released $version (npm dist-tag: $tag)" >> "$GITHUB_STEP_SUMMARY"

      # pnpm exchanges the GitHub OIDC token with npm (trusted publishing)
      - name: Publish
        if: steps.version.outputs.released == 'true'
        env:
          # only reachable with dry-run in publish-only mode
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=(--tag "${{ steps.version.outputs.tag }}")
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          pnpm exec nx release publish "${args[@]}"
